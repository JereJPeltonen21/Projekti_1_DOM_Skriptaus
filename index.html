<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>To Play List</title>
</head>
<body>
        <form id="gameForm">
            <h1>To Play List</h1>

            <hr>

            <label for="game">Peli</label>
            <input type="text" id="game" name="game">
            
            <br>

            <button type="submit">Lisää taulukkoon</button>

            <table id="GameTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Played</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="GameTableBody">
                </tbody>
            </table>
        </form>
</body>
</html>
