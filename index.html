<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>To Play List</title>
</head>
<body>
    <div class="parent-div">
        <div class="centerDiv">
            <form id="gameForm">
                <div class="headerPlusPhoto">
                    <img src="gamepad-solid.svg" role="img" alt="Game Controller">
                    <h1>To Play List</h1>
                </div>

                <input type="text" id="game" name="game">
                
                <button type="submit" class="AddGameButton">Add Game</button>

                <br>

                <table id="GameTable" class="center">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Played</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="GameTableBody">
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
